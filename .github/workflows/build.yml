# Proves the repository builds from a clean checkout with nothing else downloaded.
# If this is green, "it doesn't build" is a local toolchain problem, not a missing file.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build every add-on
        shell: pwsh
        run: |
          foreach ($t in 'neural', 'probe', 'session') {
            .\build.ps1 -Target $t
            if ($LASTEXITCODE -ne 0) { throw "$t failed" }
          }

      - name: Build the OpenGL diagnostics
        shell: pwsh
        run: |
          .\build.ps1 -Target glinfo
          if ($LASTEXITCODE -ne 0) { throw 'glinfo failed' }
          .\build.ps1 -Target glprobe -Exe
          if ($LASTEXITCODE -ne 0) { throw 'glprobe failed' }

      - name: Build isolated GPU fixture
        shell: pwsh
        run: .\build.ps1 -Target framecheck -Exe

      # The add-on must reach OpenGL through GetProcAddress and never through its import
      # table: a static opengl32 import loads OpenGL into every D3D11 and D3D12 game this is
      # placed in, which is what one unwanted import already did to NFS 2015. Here it is read
      # off the binary that was just built, which the Linux job below cannot do.
      - name: The add-on does not import opengl32
        shell: pwsh
        run: |
          python tools/opengl_import_check.py build/amd-nr.addon64
          if ($LASTEXITCODE -ne 0) { throw 'opengl import check failed' }

      - name: Check composition and guide selection
        shell: pwsh
        run: |
          python tools/compose_check.py
          if ($LASTEXITCODE -ne 0) { throw "composition check failed" }
          python tools/guide_switch_check.py
          if ($LASTEXITCODE -ne 0) { throw "guide check failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: addons
          path: |
            build/*.addon64
            build/amd-nr-framecheck.exe
            build/amd-nr-glprobe.exe

  x86-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and test x86 bridge
        shell: pwsh
        run: .\build-x86bridge.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: x86-bridge
          path: |
            build-x86bridge/amd-nr.addon32
            build-x86bridge/amd-nr-host64.exe
            build-x86bridge/protocol-test-*.log
            build-x86bridge/io-test-*.log
            build-x86bridge/imports-*.txt
            build-x86bridge/SHA256SUMS.txt

  x86-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test x86 bridge contracts and control flow
        run: python3 tools/test-x86bridge.py

      # No runtime binary ships with this project, so the half of this check that reads one cannot
      # run here. The half that can is the one that matters: every address written into the runtime
      # has to be named in runtime_offsets.h and nowhere else. Four files once held their own
      # copies, two were left a version behind, and that survived a clean build, a green suite and
      # two code reviews before it crashed the 32-bit bridge in every game.
      - name: No source file writes a runtime offset of its own
        run: python3 tools/runtime_offsets_check.py

      # The source half of the windows job's import check, and it needs no toolchain: no bare
      # gl call, no pragma naming the library, and no opengl32.lib on the shared link line.
      - name: No source reaches OpenGL by linking to it
        run: python3 tools/opengl_import_check.py

      # The panel both routes draw, run against a recorder in place of ReShade's ImGui: every
      # cascade tick shows its own control, Portuguese is complete, each button asks for its action.
      - name: The shared panel draws what each setting asks for
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iexternal/reshade tools/panel_check.cpp src/ui/*.cpp src/ui/*/*.cpp -o panel_check
          ./panel_check

      # 500 lines per file of our own. The ones already over it are grandfathered at their
      # current length in tools/line_limit_allow.json, and may only shrink.
      - name: No file grows past the line limit
        run: python3 tools/line_limit_check.py
